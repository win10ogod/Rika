name: Test Running

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    paths:
      - '**.mjs'
      - '**/SKILL.md'
      - '.github/workflows/CI.yaml'
    tags-ignore:
      - '*'
    branches:
      - '*'

jobs:
  test-running:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Rika
        uses: actions/checkout@v4

      - name: Checkout fount-charCI
        uses: actions/checkout@v4
        with:
          repository: steve02081504/fount-charCI
          path: .ci/fount-charCI

      - name: Checkout fount
        uses: actions/checkout@v4
        with:
          repository: steve02081504/fount
          ref: master
          path: .ci/fount-charCI/fount

      - name: Prepare character fixture
        shell: bash
        run: |
          export CI_ROOT="$GITHUB_WORKSPACE/.ci/fount-charCI"
          CI_ROOT_SHELL="$CI_ROOT"
          if command -v cygpath >/dev/null 2>&1; then
            CI_ROOT_SHELL="$(cygpath -u "$CI_ROOT")"
          fi
          FOUNT_ROOT="$CI_ROOT_SHELL/fount"
          CHAR_ROOT="$FOUNT_ROOT/.vm_data_charCI/users/CI-user/chars/Rika"
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          function read_ci_file(relative) {
          	return fs.readFileSync(path.join(process.env.CI_ROOT, relative), 'utf8')
          }
          function write_ci_file(relative, content) {
          	fs.writeFileSync(path.join(process.env.CI_ROOT, relative), content)
          }

          // fount-charCI evolves upstream; each patch applies only when still needed.
          let source = read_ci_file('default_data/users/CI-user/serviceGenerators/AI/CI/main.mjs')
          if (source.includes('shells/chat/src/prompt_struct.mjs'))
          	write_ci_file(
          		'default_data/users/CI-user/serviceGenerators/AI/CI/main.mjs',
          		source.replace('shells/chat/src/prompt_struct.mjs', 'shells/chat/src/prompt_struct/index.mjs'),
          	)

          source = read_ci_file('src/fount.mjs')
          if (/world: null,\s*\n\s*char,\s*\n\s*user: null,/.test(source))
          	write_ci_file(
          		'src/fount.mjs',
          		source.replace(
          			/world: null,\s*\n\s*char,\s*\n\s*user: null,/,
          			'world: { interfaces: { chat: {} } },\n\t\tchar,\n\t\tuser: { interfaces: { chat: {} } },',
          		),
          	)

          if (!read_ci_file('default_data/users/CI-user/serviceGenerators/AI/CI/main.mjs').includes('shells/chat/src/prompt_struct'))
          	throw new Error('fount-charCI AI source lost its prompt_struct import')

          // deno#36597: node-datachannel@0.33.1 lists an optional native binary
          // (@node-datachannel/android-arm64@0.33.1) that was never published,
          // so whole-graph resolution fails on every OS. Pin the bare specifier
          // to the last fully published release until upstream heals.
          const deno_config_relative = 'fount/deno.json'
          let deno_config_text = read_ci_file(deno_config_relative)
          if (!deno_config_text.includes('"npm:node-datachannel": "npm:node-datachannel@0.33.0"')) {
          	try {
          		const deno_config = JSON.parse(deno_config_text)
          		deno_config.imports ??= {}
          		deno_config.imports['npm:node-datachannel'] = 'npm:node-datachannel@0.33.0'
          		deno_config_text = JSON.stringify(deno_config, null, '\t')
          	} catch {
          		deno_config_text = deno_config_text.replace('"imports": {', '"imports": {\n\t\t"npm:node-datachannel": "npm:node-datachannel@0.33.0",')
          	}
          	write_ci_file(deno_config_relative, deno_config_text)
          }
          NODE
          cp -R "$CI_ROOT/default_data" "$FOUNT_ROOT/.vm_data_charCI"
          mkdir -p "$CHAR_ROOT" "$FOUNT_ROOT/.vm_data_charCI/users/CI-user/settings"
          git archive HEAD | tar -x -C "$CHAR_ROOT"
          echo "CI_ROOT=$CI_ROOT" >> "$GITHUB_ENV"
          echo "CI_ROOT_SHELL=$CI_ROOT_SHELL" >> "$GITHUB_ENV"
          echo "GITHUB_ACTION_PATH=$CI_ROOT" >> "$GITHUB_ENV"
          echo "CI_username=CI-user" >> "$GITHUB_ENV"
          echo "CI_charname=Rika" >> "$GITHUB_ENV"

      - name: Setup latest Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Run character CI against fount
        shell: bash
        run: >-
          deno run --allow-scripts --allow-all --unstable-npm-lazy-caching
          -c "$CI_ROOT_SHELL/fount/deno.json"
          "$CI_ROOT_SHELL/index.mjs"
          .github/workflows/CI.mjs
